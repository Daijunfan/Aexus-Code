name: Aexus Code CI

on:
  push:
    branches:
      - main
      - aexus/main
  pull_request:
    branches:
      - main
      - aexus/main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aexus-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-typecheck-and-ade-tests:
    name: Core Typecheck, ESLint, ADE Node & Browser Tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout Aexus Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.16.0

      - name: Setup Node.js (.nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            build/pnpm-lock.yaml
            extensions/pnpm-lock.yaml

      - name: Install dependencies (minimal native build for @vscode/sqlite3)
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm rebuild @vscode/sqlite3
          pnpm -C build install --frozen-lockfile --ignore-scripts
          pnpm -C extensions install --frozen-lockfile --ignore-scripts

      - name: Download Electron type definitions (.build/typings/electron.d.ts)
        run: node build/npm/electronTypes.ts

      - name: Fast transpile client sources (src -> out)
        run: pnpm run transpile-client

      - name: Build aexus-agents extension & 45 ade_* CLI shims
        run: node extensions/aexus-agents/esbuild.mts

      - name: Validate architecture layers & Typecheck client
        run: |
          npm run valid-layers-check
          npm run typecheck-client

      - name: Typecheck aexus-agents extension
        run: pnpm exec tsc -p extensions/aexus-agents/tsconfig.json --noEmit

      - name: Lint ADE platform, workbench & aexus-agents sources
        run: pnpm exec eslint --max-warnings=0 "src/vs/platform/ade/**/*.ts" "src/vs/workbench/contrib/ade/**/*.ts" "extensions/aexus-agents/src/**/*.ts"

      - name: Run ADE platform Node unit tests
        run: node test/unit/node/index.js --runGlob "vs/platform/ade/test/node/*.test.js"

      - name: Prepare Electron test runtime for headless Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libgbm1 libnss3 libasound2t64
          pnpm run electron
          if [ -f .build/electron/chrome-sandbox ]; then
            sudo chown root .build/electron/chrome-sandbox
            sudo chmod 4755 .build/electron/chrome-sandbox
          fi

      - name: Run ADE browser workbench unit tests
        run: |
          for t in src/vs/workbench/contrib/ade/test/browser/*.test.ts; do
            if [ -f "$t" ]; then
              xvfb-run -a ./scripts/test.sh --run "$t"
            fi
          done

  agents-cli-and-cross-platform:
    name: Agents & 45 ade_* CLIs (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout Aexus Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.16.0

      - name: Setup Node.js (.nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: extensions/pnpm-lock.yaml

      - name: Install extension build dependencies (esbuild & TypeScript)
        run: pnpm -C extensions install --frozen-lockfile --ignore-scripts

      - name: Build aexus-agents bundle & 45 ade_* CLI shims
        run: node extensions/aexus-agents/esbuild.mts

      - name: Run aexus-agents & 45 CLI unit tests
        run: node --test --experimental-strip-types extensions/aexus-agents/test/*.test.*

      - name: Smoke-check generated 45 ade_* CLI fail-closed auth contract
        run: |
          set +e
          OUT_JSON="$(env -u ADE_AGENT_TOKEN ./extensions/aexus-agents/bin/ade_whoami)"
          EXIT_CODE=$?
          set -e
          if [ "$EXIT_CODE" -ne 1 ]; then
            echo "Expected exit code 1 without ADE_AGENT_TOKEN, got $EXIT_CODE" >&2
            exit 1
          fi
          node -e '
            const res = JSON.parse(process.argv[1]);
            if (res.ok !== false || res.code !== "ERR_UNAUTHORIZED") {
              console.error("Unexpected unauthenticated CLI response:", res);
              process.exit(1);
            }
            console.log("Fail-closed ERR_UNAUTHORIZED verified:", res.code);
          ' "$OUT_JSON"
        shell: bash

  docs-and-manifest-integrity:
    name: Docs, Open VSX & Shell Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Aexus Code
        uses: actions/checkout@v4

      - name: Setup Node.js (.nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Verify shell scripts syntax & regenerate 45 CLI shims
        run: |
          bash -n scripts/aexus-install.sh
          bash -n scripts/aexus-env.sh
          node extensions/aexus-agents/scripts/genAdeBins.mjs

      - name: Verify product.json, desktop entry, Rebuild docs & relative markdown links
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");

            const product = JSON.parse(fs.readFileSync("product.json", "utf8"));
            if (!product.extensionsGallery?.serviceUrl?.includes("open-vsx.org")) {
              console.error("product.json extensionsGallery must target Open VSX");
              process.exit(1);
            }
            if (!product.aexusVersion) {
              console.error("product.json must define aexusVersion");
              process.exit(1);
            }

            const desktopEntry = fs.readFileSync("resources/linux/code.desktop", "utf8");
            if (desktopEntry.includes("Code Editing. Redefined.") || /Keywords=vscode;/i.test(desktopEntry)) {
              console.error("resources/linux/code.desktop still contains upstream VS Code branding");
              process.exit(1);
            }

            const docs = [
              "README.md",
              "docs/README.zh-CN.md",
              "docs/ARCHITECTURE.md",
              "docs/gallery.md",
              "CONTRIBUTING.md",
              "SECURITY.md",
              "CODE_OF_CONDUCT.md",
              "CHANGELOG.md",
              "extensions/aexus-agents/README.md"
            ];
            let checked = 0;
            const missing = [];
            for (const doc of docs) {
              if (!fs.existsSync(doc)) { missing.push(doc); continue; }
              const text = fs.readFileSync(doc, "utf8");
              const re = /(?:src|srcset|href)="([^"]+)"|\]\(([^)]+)\)/g;
              let m;
              while ((m = re.exec(text))) {
                const raw = (m[1] || m[2] || "").trim();
                if (!raw || /^(https?:|mailto:|#)/i.test(raw)) continue;
                const clean = raw.split("#")[0].split("?")[0];
                if (!clean) continue;
                const target = path.resolve(path.dirname(doc), clean);
                checked++;
                if (!fs.existsSync(target)) missing.push(`${doc} -> ${raw}`);
              }
            }

            for (const f of ["AGENTS.md", "Rebuild/AGENTS.md", "Rebuild/Ticket.md", "Rebuild/orchestration.md", "Rebuild/whiteBoard.md"]) {
              if (!fs.existsSync(f)) missing.push(`missing spec: ${f}`);
            }

            if (missing.length) {
              console.error("Integrity failures:\n" + missing.join("\n"));
              process.exit(1);
            }
            console.log(`Verified product.json (v${product.aexusVersion}, Open VSX), Linux desktop entry, Rebuild specs, and ${checked} doc links/assets.`);
          '
