name: Aexus Code CI

on:
  push:
    branches:
      - main
      - aexus/main
  pull_request:
    branches:
      - main
      - aexus/main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aexus-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-typecheck-and-ade-tests:
    name: Core Typecheck, ESLint, ADE Node & Browser Tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout Aexus Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.16.0

      - name: Setup Node.js (.nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            build/pnpm-lock.yaml
            extensions/pnpm-lock.yaml

      - name: Install dependencies (minimal native build for @vscode/sqlite3)
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm rebuild @vscode/sqlite3
          pnpm -C build install --frozen-lockfile --ignore-scripts
          pnpm -C extensions install --frozen-lockfile --ignore-scripts

      - name: Download Electron type definitions (.build/typings/electron.d.ts)
        run: node build/npm/electronTypes.ts

      - name: Fast transpile client sources (src -> out)
        run: pnpm run transpile-client

      - name: Build aexus-agents extension & bundled aexus-ade CLI
        run: node extensions/aexus-agents/esbuild.mts

      - name: Typecheck client (src/tsconfig.json)
        run: pnpm run typecheck-client

      - name: Typecheck aexus-agents extension
        run: pnpm exec tsc -p extensions/aexus-agents/tsconfig.json --noEmit

      - name: Lint ADE platform, workbench & aexus-agents sources
        run: pnpm exec eslint --max-warnings=0 "src/vs/platform/ade/**/*.ts" "src/vs/workbench/contrib/ade/**/*.ts" "extensions/aexus-agents/src/**/*.ts"

      - name: Run ADE platform Node unit tests
        run: node test/unit/node/index.js --runGlob "vs/platform/ade/test/node/*.test.js"

      - name: Prepare Electron test runtime for headless Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libgbm1 libnss3 libasound2t64
          pnpm run electron
          if [ -f .build/electron/chrome-sandbox ]; then
            sudo chown root .build/electron/chrome-sandbox
            sudo chmod 4755 .build/electron/chrome-sandbox
          fi

      - name: Run ADE browser workbench unit tests
        run: >
          xvfb-run -a ./scripts/test.sh
          --run src/vs/workbench/contrib/ade/test/browser/adeControlAndViews.test.ts
          --run src/vs/workbench/contrib/ade/test/browser/adeProjectsService.test.ts
          --run src/vs/workbench/contrib/ade/test/browser/cloudHostsBrowser.test.ts

  agents-cli-and-cross-platform:
    name: Agents & CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout Aexus Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.16.0

      - name: Setup Node.js (.nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: extensions/pnpm-lock.yaml

      - name: Install extension build dependencies (esbuild & TypeScript)
        run: pnpm -C extensions install --frozen-lockfile --ignore-scripts

      - name: Build aexus-agents bundle (dist/adeCli.js & preloads)
        run: node extensions/aexus-agents/esbuild.mts

      - name: Run aexus-agents & CLI unit tests
        run: node --test --experimental-strip-types extensions/aexus-agents/test/*.test.*

      - name: Smoke-check standalone aexus-ade CLI (version, doctor JSON, completion)
        run: |
          node --experimental-strip-types extensions/aexus-agents/src/adeCli.ts --version
          node --experimental-strip-types extensions/aexus-agents/src/adeCli.ts completion zsh > /dev/null
          node --experimental-strip-types extensions/aexus-agents/src/adeCli.ts completion bash > /dev/null
          node --experimental-strip-types extensions/aexus-agents/src/adeCli.ts completion fish > /dev/null
          # doctor may exit non-zero on headless CI runners without local coding CLIs; assert valid JSON report
          set +e
          DOCTOR_JSON="$(node --experimental-strip-types extensions/aexus-agents/src/adeCli.ts doctor --project . --json)"
          DOCTOR_EXIT=$?
          set -e
          if [ "$DOCTOR_EXIT" -ne 0 ] && [ "$DOCTOR_EXIT" -ne 1 ] && [ "$DOCTOR_EXIT" -ne 2 ]; then
            echo "Unexpected doctor exit code: $DOCTOR_EXIT" >&2
            exit 1
          fi
          node -e '
            const report = JSON.parse(process.argv[1]);
            if (!report.platform || !Array.isArray(report.engines) || report.engines.length < 8) {
              console.error("Invalid doctor JSON report:", report);
              process.exit(1);
            }
            console.log(`Doctor JSON OK (${report.platform}/${report.arch}, ${report.engines.length} engines checked, exit=${process.argv[2]})`);
          ' "$DOCTOR_JSON" "$DOCTOR_EXIT"
        shell: bash

  docs-and-blueprints-integrity:
    name: Docs, Blueprints, Open VSX & Shell Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Aexus Code
        uses: actions/checkout@v4

      - name: Setup Node.js (.nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Verify shell scripts syntax
        run: |
          bash -n scripts/aexus-install.sh
          bash -n scripts/aexus-env.sh

      - name: Verify version parity (product.json, aexus-agents, aexus-ade CLI)
        run: |
          node -e '
            const fs = require("fs");
            const product = JSON.parse(fs.readFileSync("product.json", "utf8"));
            const extPkg = JSON.parse(fs.readFileSync("extensions/aexus-agents/package.json", "utf8"));
            const cliSrc = fs.readFileSync("extensions/aexus-agents/src/adeCli.ts", "utf8");
            const cliMatch = cliSrc.match(/export\s+const\s+ADE_CLI_VERSION\s*=\s*[\x27"]([^\x27"]+)[\x27"]/);
            const productVer = product.aexusVersion;
            const extVer = extPkg.version;
            const cliVer = cliMatch?.[1];
            if (!productVer || !extVer || !cliVer) {
              console.error("Missing version field:", { productVer, extVer, cliVer });
              process.exit(1);
            }
            if (productVer !== extVer || productVer !== cliVer) {
              console.error("Version parity mismatch:", {
                "product.json#aexusVersion": productVer,
                "extensions/aexus-agents/package.json#version": extVer,
                "extensions/aexus-agents/src/adeCli.ts#ADE_CLI_VERSION": cliVer
              });
              process.exit(1);
            }
            console.log(`Version parity OK: ${productVer} (product.json == aexus-agents == aexus-ade CLI)`);
          '

      - name: Verify product.json, desktop entry, relative markdown links, assets & all 6 blueprint recipes
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");

            const product = JSON.parse(fs.readFileSync("product.json", "utf8"));
            if (!product.extensionsGallery?.serviceUrl?.includes("open-vsx.org")) {
              console.error("product.json extensionsGallery must target Open VSX");
              process.exit(1);
            }
            if (!product.aexusVersion) {
              console.error("product.json must define aexusVersion");
              process.exit(1);
            }

            const desktopEntry = fs.readFileSync("resources/linux/code.desktop", "utf8");
            if (desktopEntry.includes("Code Editing. Redefined.") || /Keywords=vscode;/i.test(desktopEntry)) {
              console.error("resources/linux/code.desktop still contains upstream VS Code branding");
              process.exit(1);
            }

            const docs = [
              "README.md",
              "docs/README.zh-CN.md",
              "docs/ARCHITECTURE.md",
              "docs/gallery.md",
              "CONTRIBUTING.md",
              "SECURITY.md",
              "CODE_OF_CONDUCT.md",
              "CHANGELOG.md",
              "examples/blueprints/README.md"
            ];
            let checked = 0;
            const missing = [];
            for (const doc of docs) {
              if (!fs.existsSync(doc)) { missing.push(doc); continue; }
              const text = fs.readFileSync(doc, "utf8");
              if (/(?:href|src|srcset)="[^"]*AEXUS\.md|\]\([^)]*AEXUS\.md/i.test(text)) {
                missing.push(`${doc} links to retired AEXUS.md`);
              }
              const re = /(?:src|srcset|href)="([^"]+)"|\]\(([^)]+)\)/g;
              let m;
              while ((m = re.exec(text))) {
                const raw = (m[1] || m[2] || "").trim();
                if (!raw || /^(https?:|mailto:|#)/i.test(raw)) continue;
                const clean = raw.split("#")[0].split("?")[0];
                if (!clean) continue;
                const target = path.resolve(path.dirname(doc), clean);
                checked++;
                if (!fs.existsSync(target)) missing.push(`${doc} -> ${raw}`);
              }
            }

            const requiredBlueprints = [
              "feature-ship.md",
              "bug-hunt-fix.md",
              "security-audit-swarm.md",
              "safe-migration.md",
              "deep-research-lab.md",
              "arch-teardown.md"
            ];
            for (const bp of requiredBlueprints) {
              const full = path.join("examples/blueprints", bp);
              if (!fs.existsSync(full)) {
                missing.push(`missing blueprint: ${full}`);
                continue;
              }
              const content = fs.readFileSync(full, "utf8");
              for (const token of ["```mermaid", "flowchart LR", "## Node Pre-Prompts"]) {
                if (!content.includes(token)) {
                  missing.push(`blueprint ${full} missing required field/section: ${token}`);
                }
              }
              for (const legacy of ["## Tree Metadata", "## Auto-Partitioned Managers", "worker="]) {
                if (content.includes(legacy)) {
                  missing.push(`blueprint ${full} still contains legacy token: ${legacy}`);
                }
              }
            }

            if (missing.length) {
              console.error("Integrity failures:\n" + missing.join("\n"));
              process.exit(1);
            }
            console.log(`Verified product.json (v${product.aexusVersion}, Open VSX), Linux desktop entry, ${checked} doc links/assets, and ${requiredBlueprints.length} example blueprints.`);
          '
