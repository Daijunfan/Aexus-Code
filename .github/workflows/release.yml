name: Aexus Code Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release version label (used for artifact naming on manual runs)'
        required: false
        default: 'dev'

permissions:
  contents: write

concurrency:
  group: aexus-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Package (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            os: macos-15
            gulp_task: vscode-darwin-arm64
            out_dir: VSCode-darwin-arm64
            artifact_ext: zip
          - target: darwin-x64
            os: macos-15-intel
            gulp_task: vscode-darwin-x64
            out_dir: VSCode-darwin-x64
            artifact_ext: zip
          - target: linux-x64
            os: ubuntu-latest
            gulp_task: vscode-linux-x64
            out_dir: VSCode-linux-x64
            artifact_ext: tar.gz
          - target: win32-x64
            os: windows-latest
            gulp_task: vscode-win32-x64
            out_dir: VSCode-win32-x64
            artifact_ext: zip

    steps:
      - name: Checkout Aexus Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.16.0

      - name: Setup Node.js (.nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install Linux native build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libx11-dev libxkbfile-dev libsecret-1-dev libkrb5-dev

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packaged application (${{ matrix.gulp_task }})
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: pnpm run gulp ${{ matrix.gulp_task }}

      - name: Package macOS release archive & DMG
        if: runner.os == 'macOS'
        env:
          TARGET: ${{ matrix.target }}
          OUT_DIR: ${{ matrix.out_dir }}
          RELEASE_LABEL: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag || 'dev' }}
        run: |
          mkdir -p release-artifacts
          APP_PATH="../${OUT_DIR}/Aexus Code.app"
          codesign --force --deep --sign - "$APP_PATH"
          codesign --verify --deep --strict "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "release-artifacts/Aexus-Code-${RELEASE_LABEL}-${TARGET}.zip"
          hdiutil create -volname "Aexus Code" -srcfolder "$APP_PATH" -ov -format UDZO "release-artifacts/Aexus-Code-${RELEASE_LABEL}-${TARGET}.dmg"

      - name: Package Linux release archive
        if: runner.os == 'Linux'
        env:
          TARGET: ${{ matrix.target }}
          OUT_DIR: ${{ matrix.out_dir }}
          RELEASE_LABEL: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag || 'dev' }}
        run: |
          mkdir -p release-artifacts
          tar -czf "release-artifacts/Aexus-Code-${RELEASE_LABEL}-${TARGET}.tar.gz" -C ".." "${OUT_DIR}"

      - name: Package Windows release archive
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          OUT_DIR: ${{ matrix.out_dir }}
          RELEASE_LABEL: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag || 'dev' }}
        run: |
          New-Item -ItemType Directory -Force -Path release-artifacts | Out-Null
          $src = Join-Path (Resolve-Path "..").Path $env:OUT_DIR
          $dest = "release-artifacts/Aexus-Code-$($env:RELEASE_LABEL)-$($env:TARGET).zip"
          Compress-Archive -Path "$src\*" -DestinationPath $dest -Force

      - name: Upload platform artifact
        uses: actions/upload-artifact@v4
        with:
          name: aexus-code-${{ matrix.target }}
          path: release-artifacts/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-release
          merge-multiple: true

      - name: Generate SHA-256 checksums
        working-directory: dist-release
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: dist-release/*
          body: |
            ## Aexus Code ${{ github.ref_name }}

            Prebuilt binaries for **macOS (`arm64` / `x64`)**, **Linux (`x64`)**, and **Windows (`x64`)**.

            - **Extension Gallery**: Configured for [Open VSX](https://open-vsx.org/) (`open-vsx.org/vscode/gallery`).
            - **macOS Signing Note**: Release builds without an Apple Developer ID secret use an ad-hoc signature. On first launch on macOS, remove quarantine or open via Finder → Right-Click → Open (`xattr -dr com.apple.quarantine "/Applications/Aexus Code.app"`).
            - **Verification**: Compare downloaded files against `SHA256SUMS.txt`.
